name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: AMS ${{ matrix.ams }} / FW ${{ matrix.fw }}
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ams: "1.12.0", fw: "23.0.0" }
          - { ams: "1.12.1", fw: "23.0.1" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch Atmosphère ${{ matrix.ams }} libraries
        run: tools/fetch_ams_libs.sh "${{ matrix.ams }}"

      - name: Install latest libnx
        run: |
          pushd /tmp
          git clone --depth 1 https://github.com/switchbrew/libnx
          make -C libnx -j"$(nproc)"
          make -C libnx install
          popd

      - name: Build
        run: make -j"$(nproc)"

      - name: Name package
        run: echo "PKG=ldn_mitm-lanplay_v$(cat VERSION)_AMS${{ matrix.ams }}_FW${{ matrix.fw }}" >> "$GITHUB_ENV"

      - name: Upload SD card files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: out/sd
          # switch/.overlays is a hidden folder; upload-artifact v4 skips those by default
          include-hidden-files: true

      - name: Upload debug ELFs
        uses: actions/upload-artifact@v4
        with:
          name: debug-elf_AMS${{ matrix.ams }}
          path: |
            ldn_mitm/ldn_mitm.elf
            overlay/overlay.elf

  tool:
    name: PC test tool (Windows + Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64

      - name: Build
        run: |
          make -C tools/vswitch vswitch LDFLAGS=-static
          make -C tools/vswitch windows
          mkdir -p tool
          cp tools/vswitch/vswitch.exe tool/
          cp tools/vswitch/vswitch tool/vswitch-linux-x86_64
          cp tools/vswitch/README-zh.txt tool/README.txt

      - name: Smoke test (Linux)
        run: tool/vswitch-linux-x86_64 --help

      - uses: actions/upload-artifact@v4
        with:
          name: vswitch-tool
          path: tool

  release:
    name: Publish release
    # Every push to main (or a v* tag) refreshes the release named after ./VERSION.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, tool]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VER=$(cat VERSION)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: ldn_mitm-lanplay_*
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: debug-elf_*
          path: elf

      - uses: actions/download-artifact@v4
        with:
          name: vswitch-tool
          path: vswitch-tool

      - name: Zip packages
        run: |
          (cd vswitch-tool && chmod +x vswitch-linux-x86_64 && zip -qr "../dist/vswitch-tool_v${VER}.zip" .)
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          ls -la
          # fail loudly if the overlay ever goes missing again
          for z in ldn_mitm-lanplay_*.zip; do unzip -l "$z" | grep -q 'switch/.overlays/ldnmitm_config.ovl' || { echo "overlay missing in $z"; exit 1; }; done
          # debug symbols for reading Atmosphère crash reports (not needed on the console)
          cd ../elf && for d in */; do (cd "$d" && zip -qr "../../dist/${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: ldn_mitm-lanplay v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          overwrite_files: true
          make_latest: true
          body: |
            請下載跟主機大氣層版本相同的那一包，解壓到 SD 卡根目錄後重新開機。
            - `AMS1.12.0_FW23.0.0`：大氣層 1.12.0／系統 23.0.0
            - `AMS1.12.1_FW23.0.1`：大氣層 1.12.1／系統 23.0.1

            `vswitch-tool_*.zip`（虛擬 Switch 測試工具）：電腦用的連線測試工具（Windows／Linux），用法見裡面的使用說明。

            使用說明見 README。
